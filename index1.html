<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Runway – Smart Expense Tracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Figtree:wght@400;500;600&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg: #e8edf1;
            --surface: #f7f9fa;
            --ink: #14213d;
            --mute: #5b6b82;
            --line: #c9d3dc;
            --accent: #f2a900;
            --good: #0f8b8d;
            --bad: #e4572e;
            --grid: rgba(20, 33, 61, .06);
            color-scheme: light;
            box-sizing: border-box;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px)
        }

        *,
        *::before,
        *::after {
            box-sizing: inherit
        }

        html {
            scroll-padding-top: env(safe-area-inset-top, 0px)
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--ink);
            font: 16px/1.5 Figtree, system-ui, sans-serif;
            background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
            background-size: 24px 24px
        }

        .wrap {
            max-width: 980px;
            margin: 0 auto;
            padding: 20px 18px 60px
        }

        h1,
        h2,
        .big {
            font-family: "Bricolage Grotesque", Figtree, sans-serif;
            margin: 0
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-bottom: 22px
        }

        .brand {
            font: 800 1.4rem "Bricolage Grotesque", sans-serif;
            letter-spacing: -.02em
        }

        .brand i {
            display: inline-block;
            width: .7em;
            height: .7em;
            background: var(--accent);
            border-radius: 50% 50% 50% 0;
            margin-right: .35em;
            transform: rotate(-45deg)
        }

        .hbtns {
            display: flex;
            gap: 8px;
            align-items: center;
            color: var(--mute);
            font-size: .9rem
        }

        button {
            font: inherit;
            color: inherit;
            cursor: pointer
        }

        .ghost {
            background: none;
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 5px 10px;
            color: var(--mute)
        }

        .ghost:hover {
            border-color: var(--ink);
            color: var(--ink)
        }

        :focus-visible {
            outline: 3px solid var(--accent);
            outline-offset: 2px
        }

        .hero {
            display: grid;
            grid-template-columns: 1.3fr 1fr;
            gap: 28px;
            align-items: end;
            margin-bottom: 26px
        }

        @media(max-width:720px) {
            .hero {
                grid-template-columns: 1fr
            }
        }

        .lbl {
            color: var(--mute);
            font-size: .95rem
        }

        .big {
            font-weight: 800;
            font-size: clamp(3.4rem, 11vw, 6.2rem);
            line-height: .95;
            letter-spacing: -.04em
        }

        .big.neg {
            color: var(--bad)
        }

        .sub {
            margin: 10px 0 0;
            color: var(--mute);
            max-width: 46ch
        }

        .sub b {
            color: var(--ink);
            font-weight: 600
        }

        .meter {
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 14px;
            padding: 16px
        }

        .bar {
            height: 12px;
            border-radius: 6px;
            background: var(--line);
            overflow: hidden;
            margin: 10px 0 8px
        }

        .bar>span {
            display: block;
            height: 100%;
            background: var(--good);
            transition: width .5s
        }

        .bar.warn>span {
            background: var(--accent)
        }

        .bar.over>span {
            background: var(--bad)
        }

        .row {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            font-size: .92rem
        }

        .budget-in {
            width: 7.5em;
            font: inherit;
            font-weight: 600;
            border: 0;
            border-bottom: 2px solid var(--line);
            background: none;
            color: var(--ink);
            text-align: right
        }

        .add {
            background: var(--surface);
            color: var(--ink);
            border: 1px solid var(--line);
            border-radius: 16px;
            padding: 16px 18px;
            margin-bottom: 26px
        }

        .add label {
            display: block;
            font-size: .92rem;
            opacity: .75;
            margin-bottom: 6px
        }

        .add input {
            width: 100%;
            font: 500 1.25rem Figtree, sans-serif;
            background: transparent;
            border: 0;
            border-bottom: 2px solid currentColor;
            color: inherit;
            padding: 6px 0;
            outline: none
        }

        .add input::placeholder {
            color: inherit;
            opacity: .45
        }

        .add input:focus {
            border-color: var(--accent)
        }

        .prev {
            min-height: 2em;
            margin-top: 10px;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center;
            font-size: .92rem
        }

        .chip {
            border-radius: 99px;
            padding: 2px 11px;
            background: rgba(255, 255, 255, .16);
            font-weight: 600
        }

        .hint {
            opacity: .7
        }

        section {
            margin-bottom: 28px
        }

        h2 {
            font-size: 1.25rem;
            letter-spacing: -.01em;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            gap: 10px
        }

        h2 small {
            font: 400 .85rem Figtree;
            color: var(--mute)
        }

        .strip {
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 14px;
            padding: 16px 12px 10px;
            overflow-x: auto
        }

        .days {
            position: relative;
            display: flex;
            align-items: flex-end;
            gap: 3px;
            height: 160px;
            min-width: 520px
        }

        .col {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            height: 100%;
            position: relative
        }

        .col .b {
            width: 100%;
            border-radius: 4px 4px 0 0;
            background: var(--good);
            min-height: 2px;
            transition: height .4s
        }

        .col.over .b {
            background: var(--bad)
        }

        .col.fut .b {
            background: var(--line)
        }

        .col.today .b {
            outline: 2px solid var(--accent);
            outline-offset: 1px
        }

        .col em {
            font: 500 .68rem Figtree;
            font-style: normal;
            color: var(--mute);
            margin-top: 4px
        }

        .col.today em {
            color: var(--ink);
            font-weight: 700
        }

        .limit {
            position: absolute;
            left: 0;
            right: 0;
            border-top: 2px dashed var(--accent);
            pointer-events: none
        }

        .limit span {
            position: absolute;
            right: 0;
            top: -1.4em;
            font-size: .72rem;
            color: var(--mute);
            background: var(--surface);
            padding: 0 4px
        }

        .two {
            display: grid;
            grid-template-columns: 1fr 1.3fr;
            gap: 26px
        }

        @media(max-width:720px) {
            .two {
                grid-template-columns: 1fr
            }
        }

        .cat {
            margin-bottom: 12px
        }

        .cat .row span:last-child {
            color: var(--mute)
        }

        .cat .bar {
            height: 8px;
            margin: 5px 0 0
        }

        .list {
            list-style: none;
            margin: 0;
            padding: 0;
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 14px
        }

        .list li {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 11px 14px;
            border-bottom: 1px solid var(--line)
        }

        .list li:last-child {
            border: 0
        }

        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            flex: none
        }

        .tname {
            flex: 1;
            min-width: 0
        }

        .tname div {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis
        }

        .tname small {
            color: var(--mute)
        }

        .tag {
            border: 1px solid var(--line);
            background: none;
            border-radius: 99px;
            padding: 1px 10px;
            font-size: .8rem;
            color: var(--mute)
        }

        .amt {
            font-weight: 600;
            font-variant-numeric: tabular-nums
        }

        .x {
            background: none;
            border: 0;
            color: var(--mute);
            font-size: 1.2rem;
            line-height: 1;
            padding: 4px 8px;
            border-radius: 6px
        }

        .x:hover {
            color: var(--bad)
        }

        .empty {
            padding: 26px;
            text-align: center;
            color: var(--mute)
        }

        .empty button {
            margin-top: 10px;
            background: var(--accent);
            color: #14213d;
            border: 0;
            border-radius: 10px;
            padding: 9px 16px;
            font-weight: 600
        }

        @media(prefers-reduced-motion:reduce) {
            * {
                transition: none !important
            }
        }
    </style>
</head>

<body>
    <div class="wrap">
        <header>
            <div class="brand"><i></i>Runway</div>
            <div class="hbtns"><span id="month"></span></div>
        </header>

        <div class="hero">
            <div>
                <div class="lbl">You can still spend today</div>
                <div class="big" id="safe">₹0</div>
                <p class="sub" id="story"></p>
            </div>
            <div class="meter">
                <div class="row"><span>Spent this month</span><b id="spent">₹0</b></div>
                <div class="bar" id="mbar"><span style="width:0"></span></div>
                <div class="row"><label for="budget">Monthly budget ₹</label><input class="budget-in" id="budget"
                        type="number" min="0" step="500" inputmode="numeric"></div>
            </div>
        </div>

        <div class="add">
            <label for="q">Type it the way you’d say it</label>
            <input id="q" autocomplete="off"
                placeholder="swiggy dinner 340   ·   uber 250 yesterday   ·   rent 12000 on 1st">
            <div class="prev" id="prev"><span class="hint">Amount, category and date are picked up for you. Press Enter
                    to save.</span></div>
        </div>

        <section>
            <h2>Month at a glance <small>Dashed line is your daily allowance</small></h2>
            <div class="strip">
                <div class="days" id="days"></div>
            </div>
        </section>

        <div class="two">
            <section>
                <h2>Where it goes</h2>
                <div id="cats"></div>
            </section>
            <section>
                <h2>Recent <small id="count"></small></h2>
                <ul class="list" id="list"></ul>
            </section>
        </div>
    </div>

    <script>
        const CATS = {
            Food: { c: "#e4572e", k: /food|lunch|dinner|breakfast|swiggy|zomato|coffee|tea|cafe|snack|grocer|vegetable|milk|biryani|restaurant|pizza|juice|bakery/ },
            Transport: { c: "#0f8b8d", k: /uber|ola|auto|bus|metro|train|petrol|fuel|diesel|cab|taxi|parking|toll|flight|rapido/ },
            Shopping: { c: "#8e6bd1", k: /amazon|flipkart|shirt|shoes|cloth|myntra|shop|gift|mall|phone|gadget/ },
            Bills: { c: "#3a6ea5", k: /rent|bill|electric|wifi|internet|recharge|emi|insurance|water|gas|subscription|netflix|loan/ },
            Fun: { c: "#f2a900", k: /movie|game|concert|party|bar|trip|outing|spotify|fun|ticket/ },
            Health: { c: "#4aa56b", k: /doctor|medicine|pharmacy|gym|hospital|clinic|medical|yoga/ },
            Other: { c: "#8a97a8", k: /$^/ }
        };
        const names = Object.keys(CATS);
        const $ = id => document.getElementById(id);
        const inr = n => "₹" + Math.round(n).toLocaleString("en-IN");
        const iso = d => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
        const now = new Date(), Y = now.getFullYear(), M = now.getMonth(), N = new Date(Y, M + 1, 0).getDate(), T = now.getDate();
        let S = { budget: 30000, tx: [] };
        try { const r = localStorage.getItem("runway-v1"); if (r) S = JSON.parse(r) } catch (e) { }
        const save = () => { try { localStorage.setItem("runway-v1", JSON.stringify(S)) } catch (e) { } };

        function parse(text) {
            let s = text.trim(); if (!s) return null;
            let day = T, label = "today";
            if (/\byesterday\b/i.test(s)) { day = T - 1; label = "yesterday"; s = s.replace(/\byesterday\b/i, "") }
            else if (/\btoday\b/i.test(s)) { s = s.replace(/\btoday\b/i, "") }
            else {
                const m = s.match(/\b(?:on\s+)?(\d{1,2})(st|nd|rd|th)\b/i);
                if (m && +m[1] >= 1 && +m[1] <= N) { day = +m[1]; label = "the " + m[1] + m[2].toLowerCase(); s = s.replace(m[0], "") }
            }
            const a = s.match(/(?:₹|rs\.?\s*)?(\d[\d,]*(?:\.\d+)?)(k\b)?/i);
            if (!a) return null;
            let amt = parseFloat(a[1].replace(/,/g, "")); if (a[2]) amt *= 1000;
            if (!(amt > 0)) return null;
            const desc = (s.replace(a[0], "").replace(/\bon\b|\bfor\b|₹/gi, "").replace(/\s+/g, " ").trim()) || "Expense";
            let cat = "Other"; for (const n of names) { if (CATS[n].k.test(desc.toLowerCase())) { cat = n; break } }
            if (day < 1) day = 1;
            return { amt, desc: desc[0].toUpperCase() + desc.slice(1), cat, date: iso(new Date(Y, M, day)), label };
        }

        const q = $("q");
        q.addEventListener("input", () => {
            const p = parse(q.value);
            $("prev").innerHTML = p ? `<span class="chip">${inr(p.amt)}</span><span class="chip" style="background:${CATS[p.cat].c};color:#fff">${p.cat}</span><span class="chip">${p.label}</span><span class="hint">${p.desc}</span>`
                : `<span class="hint">${q.value ? "Add an amount, like “coffee 120”." : "Amount, category and date are picked up for you. Press Enter to save."}</span>`;
        });
        q.addEventListener("keydown", e => {
            if (e.key !== "Enter") return;
            const p = parse(q.value); if (!p) return;
            S.tx.push({ id: Date.now() + Math.random(), t: p.desc, amt: p.amt, cat: p.cat, date: p.date });
            q.value = ""; q.dispatchEvent(new Event("input")); save(); render();
        });
        $("budget").addEventListener("input", e => { S.budget = Math.max(0, +e.target.value || 0); save(); render(true) });
        function sample() {
            const d = [["Rent", 12000, "Bills", 1], ["Groceries", 1850, "Food", 2], ["Metro card", 500, "Transport", 3], ["Zomato dinner", 420, "Food", 4], ["Movie tickets", 700, "Fun", 6], ["Electricity bill", 1600, "Bills", 7], ["Amazon headphones", 2300, "Shopping", 9], ["Auto", 180, "Transport", 10], ["Pharmacy", 460, "Health", 12], ["Coffee", 150, "Food", 13]];
            d.forEach(([t, amt, cat, day]) => { if (day <= T) S.tx.push({ id: Math.random(), t, amt, cat, date: iso(new Date(Y, M, day)) }) });
            save(); render();
        }

        function render(skipBudgetField) {
            const mTx = S.tx.filter(t => t.date.startsWith(iso(new Date(Y, M, 1)).slice(0, 7)));
            const perDay = Array(N + 1).fill(0); mTx.forEach(t => perDay[+t.date.slice(8)] += t.amt);
            const spent = perDay.reduce((a, b) => a + b, 0);
            const before = spent - perDay[T], left = S.budget - before, daysLeft = N - T + 1;
            const allow = left / daysLeft, remainToday = allow - perDay[T];
            const allowance = S.budget / N, pace = spent / T * N;
            $("month").textContent = now.toLocaleString("en-IN", { month: "long", year: "numeric" });
            if (!skipBudgetField) $("budget").value = S.budget;
            const big = $("safe"); big.textContent = (remainToday < 0 ? "−" : "") + inr(Math.abs(remainToday)); big.classList.toggle("neg", remainToday < 0);
            $("story").innerHTML = S.budget <= 0 ? "Set a monthly budget to see your daily allowance." :
                `<b>${inr(Math.max(left, 0))}</b> is left for the next <b>${daysLeft} day${daysLeft > 1 ? "s" : ""}</b>. At today’s pace you’ll land near <b>${inr(pace)}</b> — ${pace > S.budget ? `<b style="color:var(--bad)">${inr(pace - S.budget)} over budget</b>` : `<b style="color:var(--good)">${inr(S.budget - pace)} to spare</b>`}.`;
            $("spent").textContent = inr(spent);
            const pct = S.budget ? Math.min(100, spent / S.budget * 100) : 0;
            $("mbar").className = "bar" + (spent > S.budget ? " over" : pct > 80 ? " warn" : ""); $("mbar").firstChild.style.width = pct + "%";

            const mx = Math.max(allowance * 1.6, ...perDay), H = 130;
            $("days").innerHTML = `<div class="limit" style="bottom:${24 + allowance / mx * H}px"><span>${inr(allowance)}/day</span></div>` +
                Array.from({ length: N }, (_, i) => {
                    const d = i + 1, v = perDay[d];
                    return `<div class="col${d > T ? " fut" : ""}${d === T ? " today" : ""}${v > allowance ? " over" : ""}" title="Day ${d}: ${inr(v)}"><div class="b" style="height:${v / mx * H}px"></div><em>${d % 5 === 0 || d === 1 || d === T ? d : "&nbsp;"}</em></div>`
                }).join("");

            const byCat = {}; mTx.forEach(t => byCat[t.cat] = (byCat[t.cat] || 0) + t.amt);
            const ent = Object.entries(byCat).sort((a, b) => b[1] - a[1]);
            $("cats").innerHTML = ent.length ? ent.map(([c, v]) => `<div class="cat"><div class="row"><span>${c}</span><span>${inr(v)} · ${Math.round(v / spent * 100)}%</span></div><div class="bar"><span style="width:${v / ent[0][1] * 100}%;background:${CATS[c].c}"></span></div></div>`).join("") : `<div class="lbl">Nothing logged yet.</div>`;

            const rec = [...S.tx].sort((a, b) => b.date.localeCompare(a.date) || b.id - a.id).slice(0, 30);
            $("count").textContent = S.tx.length ? `${S.tx.length} total` : "";
            $("list").innerHTML = rec.length ? rec.map(t => {
                const d = new Date(t.date + "T00:00");
                return `<li><span class="dot" style="background:${CATS[t.cat].c}"></span><div class="tname"><div>${esc(t.t)}</div><small>${d.toLocaleDateString("en-IN", { day: "numeric", month: "short" })}</small></div><button class="tag" data-c="${t.id}" title="Change category">${t.cat}</button><span class="amt">${inr(t.amt)}</span><button class="x" data-d="${t.id}" aria-label="Delete">×</button></li>`
            }).join("") :
                `<li class="empty" style="display:block">Your first expense takes five seconds: type “lunch 220” above.<br><button id="demo">Load sample month</button></li>`;
        }
        const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
        $("list").addEventListener("click", e => {
            const t = e.target;
            if (t.id === "demo") return sample();
            if (t.dataset.d) { S.tx = S.tx.filter(x => String(x.id) !== t.dataset.d) }
            else if (t.dataset.c) { const x = S.tx.find(x => String(x.id) === t.dataset.c); x.cat = names[(names.indexOf(x.cat) + 1) % names.length] }
            else return;
            save(); render();
        });
        render();
    </script>
</body>

</html>
